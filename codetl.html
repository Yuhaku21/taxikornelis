<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Translate</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
    }

    #translateBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 15px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(45deg, #36d1dc, #5b86e5);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Tombol -->
  <button id="translateBtn">🌐 EN</button>

  <!-- Konten (DEFAULT INDONESIA) -->
  <h1>Selamat Datang</h1>
  <h2>Selamat pagi</h2>
  <p>Ini adalah website sederhana untuk fitur translate</p>
  <button>Kirim</button>

  <script>
    let currentLang = localStorage.getItem("lang") || "id";

    const originalTexts = [];

    function getTextNodes(element) {
      let walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
      let nodes = [];
      let node;

      while (node = walker.nextNode()) {
        if (
          node.nodeValue.trim() !== "" &&
          node.parentNode.tagName !== "SCRIPT" &&
          node.parentNode.tagName !== "STYLE"
        ) {
          nodes.push(node);
        }
      }
      return nodes;
    }

    const nodes = getTextNodes(document.body);

    // SIMPAN TEKS ASLI (INDONESIA)
    nodes.forEach(node => {
      originalTexts.push(node.nodeValue);
    });

    // API Translate
    async function translateText(text, targetLang) {
      const res = await fetch(
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`
      );
      const data = await res.json();
      return data[0][0][0];
    }

    // GANTI BAHASA
    async function translatePage(lang) {
      for (let i = 0; i < nodes.length; i++) {
        let original = originalTexts[i];

        if (lang === "id") {
          // BALIK KE INDONESIA
          nodes[i].nodeValue = original;
        } else {
          // TRANSLATE KE ENGLISH
          let translated = await translateText(original, "en");
          nodes[i].nodeValue = translated;
        }
      }

      localStorage.setItem("lang", lang);
      updateButton();
    }

    function updateButton() {
      document.getElementById("translateBtn").textContent =
        currentLang === "id" ? "🌐 EN" : "🌐 ID";
    }

    document.getElementById("translateBtn").addEventListener("click", () => {
      currentLang = currentLang === "id" ? "en" : "id";
      translatePage(currentLang);
    });

    // INIT
    updateButton();

    if (currentLang === "en") {
      translatePage("en");
    }
  </script>

</body>
</html>
